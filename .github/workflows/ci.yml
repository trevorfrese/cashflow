name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cashflow
          POSTGRES_PASSWORD: cashflow
          POSTGRES_DB: cashflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cashflow:cashflow@localhost:5432/cashflow_test
      DATABASE_URL_TEST: postgresql://cashflow:cashflow@localhost:5432/cashflow_test
      JWT_SECRET: ci-only-secret-not-for-production
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Builds every package that has a build: the API (type build), the marketing site,
      # and the operations console.
      - name: Build
        run: pnpm build

      # End to end: the one command brings the API up against its own database on the same
      # Postgres service (created, migrated and seeded by ./dev), then the scripted happy
      # path runs over HTTP: fresh applicant, bank and point of sale, approval, lease, plan,
      # clock to the due date, landlord paid, installments collected, trial balance.
      - name: Smoke
        env:
          DATABASE_URL: postgresql://cashflow:cashflow@localhost:5432/cashflow_smoke
          NODE_ENV: development
        run: |
          ./dev --only api --detach --timeout 180
          ./dev smoke

      - name: Smoke logs
        if: failure()
        run: |
          ./dev status --json || true
          ./dev logs setup --tail 80 || true
          ./dev logs api --tail 200 || true

      - name: Stop
        if: always()
        run: ./dev stop || true
